name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v4

      - name: Check out TaskNotes plugin
        uses: actions/checkout@v4
        with:
          repository: callumalpass/tasknotes
          path: .sources/tasknotes

      - name: Check out TaskNotes app
        uses: actions/checkout@v4
        with:
          repository: callumalpass/tasknotes-app
          path: .sources/tasknotes-app

      - name: Check out TaskNotes specification
        uses: actions/checkout@v4
        with:
          repository: callumalpass/tasknotes-spec
          path: .sources/tasknotes-spec

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Install plugin reference dependencies
        run: npm ci --ignore-scripts
        working-directory: .sources/tasknotes

      - name: Build and test static documentation
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
